[package]
name = "mandelbrot"
version = "0.1.0"
edition = "2024"
description = "Rust/WebAssembly Mandelbrot set renderer"

# Compiling as both a "cdylib" (C-compatible dynamic library for WebAssembly)
# and an "rlib" (standard Rust library so `cargo test` can run unit tests).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasm-bindgen generates the JavaScript glue code that lets the browser call
# our Rust functions and pass typed arrays back and forth.
wasm-bindgen = "0.2"

# Optimize release builds (used by `wasm-pack build`) for maximum rendering speed.
[profile.release]
opt-level = 3
lto = true
