<!DOCTYPE html>
<!--
  Mandelbrot Set Viewer — HTML Entry Point
  ========================================
  This file defines the structure of our web page:
    1. A full-screen <canvas> element where Rust/WebAssembly draws the fractal pixels.
    2. A heads-up display (HUD) overlay showing the current coordinates, zoom level,
       iteration count, and keyboard shortcuts.
    3. A loading/error banner that disappears once the WebAssembly module is ready.
    4. An ES Module script tag (<script type="module">) that loads app.js.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Make the layout match the device's screen width on phones, tablets, and desktops -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mandelbrot Set Viewer — Rust &amp; WebAssembly</title>
  <!-- Inline SVG favicon so browsers don't log a 404 requesting /favicon.ico -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307090f'/%3E%3Ccircle cx='35' cy='32' r='16' fill='%2360a5fa'/%3E%3Ccircle cx='16' cy='32' r='7' fill='%2393c5fd'/%3E%3Ccircle cx='35' cy='32' r='9' fill='%2307090f'/%3E%3C/svg%3E"
  />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!--
    The HTML5 <canvas> is a rectangular grid of pixels that JavaScript can draw onto.
    We size it to fill the entire browser window in app.js, and fill its pixels using
    an RGBA byte buffer computed by our Rust WebAssembly module.
  -->
  <canvas
    id="mandelbrot-canvas"
    aria-label="Interactive Mandelbrot set fractal canvas. Use arrow keys or WASD to pan, plus or Z to zoom in, minus or X to zoom out, and R or 0 to reset."
  ></canvas>

  <!--
    HUD (Heads-Up Display) Overlay
    Positioned over the top-left corner of the canvas with a translucent dark background
    so it stays readable without obscuring the fractal. Press 'H' to hide or show it.
  -->
  <aside id="hud" class="hud" aria-live="polite">
    <header class="hud-header">
      <h1 class="hud-title">Mandelbrot Set</h1>
      <span class="hud-badge">Rust + WASM</span>
    </header>

    <!-- Live view metrics updated after every render -->
    <dl class="hud-stats">
      <div class="stat-row">
        <dt>Center X</dt>
        <dd id="stat-x">-0.500000</dd>
      </div>
      <div class="stat-row">
        <dt>Center Y</dt>
        <dd id="stat-y">0.000000</dd>
      </div>
      <div class="stat-row">
        <dt>Zoom</dt>
        <dd id="stat-zoom">1.00&times;</dd>
      </div>
      <div class="stat-row">
        <dt>Iterations</dt>
        <dd id="stat-iter">256</dd>
      </div>
      <div class="stat-row">
        <dt>Render</dt>
        <dd id="stat-time">-- ms</dd>
      </div>
    </dl>

    <hr class="hud-divider" />

    <!-- Keyboard controls reference -->
    <section class="hud-controls" aria-label="Keyboard controls">
      <div class="control-row">
        <span class="control-keys">
          <kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&larr;</kbd><kbd>&rarr;</kbd>
          <span class="key-sep">or</span>
          <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
        </span>
        <span class="control-label">Pan</span>
      </div>
      <div class="control-row">
        <span class="control-keys">
          <kbd>+</kbd> <kbd>=</kbd> <kbd>Z</kbd>
        </span>
        <span class="control-label">Zoom in</span>
      </div>
      <div class="control-row">
        <span class="control-keys">
          <kbd>-</kbd> <kbd>_</kbd> <kbd>X</kbd>
        </span>
        <span class="control-label">Zoom out</span>
      </div>
      <div class="control-row">
        <span class="control-keys">
          <kbd>R</kbd> <span class="key-sep">or</span> <kbd>0</kbd>
        </span>
        <span class="control-label">Reset view</span>
      </div>
      <div class="control-row">
        <span class="control-keys">
          <kbd>H</kbd>
        </span>
        <span class="control-label">Toggle HUD</span>
      </div>
    </section>
  </aside>

  <!-- Small subtle reminder shown only when the user hides the HUD with 'H' -->
  <div id="hud-hint" class="hud-hint hidden" aria-hidden="true">
    Press <kbd>H</kbd> to show HUD
  </div>

  <!--
    Loading / Error Overlay
    Displayed briefly while the browser downloads and compiles the .wasm binary.
    Hidden automatically as soon as the first frame finishes rendering.
  -->
  <div id="status-overlay" class="status-overlay" role="status">
    <div class="status-card">
      <p id="status-message">Loading WebAssembly module&hellip;</p>
    </div>
  </div>

  <!--
    type="module" tells the browser to load app.js as a modern JavaScript ES Module.
    This lets app.js use `import ... from './pkg/...'` to load our compiled WASM glue code.
    Note: ES Modules and WebAssembly require serving over HTTP (e.g. via `make run`),
    not opening index.html directly as a file:// URL.
  -->
  <script type="module" src="./app.js"></script>
</body>
</html>
